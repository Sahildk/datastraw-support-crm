[phases.setup]
nixPkgs = ["nodejs_20", "python311"]

[phases.install]
cmds = [
  "python3 -m venv venv",
  "venv/bin/pip install -r requirements.txt",
  "cd frontend && npm install"
]

[phases.build]
cmds = ["cd frontend && npm run build"]

[start]
cmd = "venv/bin/uvicorn backend.main:app --host 0.0.0.0 --port ${PORT:-8000}"

